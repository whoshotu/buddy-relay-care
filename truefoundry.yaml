name: buddy-relay-care
type: service

image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/whoshotu/buddy-relay-care
    ref: main
  build_spec:
    type: dockerfile
    dockerfile_path: Dockerfile

ports:
  - port: 8000
    expose: true
    protocol: TCP
    path: /

resources:
  cpu_request: 0.25
  cpu_limit: 1
  memory_request: 512
  memory_limit: 1024

replicas: 1

env:
  - name: OLLAMA_MODEL
    value: "qwen3:8b"
  - name: TRUEFOUNDRY_TOKEN
    value: ""
  - name: TRUEFOUNDRY_MODEL
    value: "buddy/openai-gpt-oss-120b-free"
  - name: OPENROUTER_API_KEY
    value: ""
  - name: OPENROUTER_MODEL
    value: "mistralai/mistral-7b-instruct"
  - name: YOUCAM_API_KEY
    value: ""
  - name: YOUCAM_API_SECRET
    value: ""

liveness_probe:
  config:
    type: http
    path: /health
    port: 8000
    initial_delay_seconds: 10
    period_seconds: 30

readiness_probe:
  config:
    type: http
    path: /health
    port: 8000
    initial_delay_seconds: 5
    period_seconds: 10
